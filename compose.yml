# Ambiente de desenvolvimento — 100% em containers.
#   docker compose up                                      → web, sidekiq, css, db, redis, minio
#   docker compose run --rm web bin/setup --skip-server    (primeira vez)
# Ver docs/specs/02-docker-e-ambiente.md
#
# Portas do host são configuráveis no .env (WEB_PORT, DB_PORT, REDIS_PORT, MINIO_PORT, MINIO_CONSOLE_PORT)
# para não conflitar com outros projetos. Entre containers os serviços usam sempre as portas internas.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local para o Active Storage (bucket privado, igual à produção)
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"           # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # console web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cria o bucket privado uma vez e sai
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb -p local/launch-os-dev &&
      mc anonymous set none local/launch-os-dev || true"

  web: &rails
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/launch_os_development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/launch_os
      - bundle:/usr/local/bundle
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    stdin_open: true   # permite `docker compose attach web` para usar o debugger
    tty: true

  # Worker de jobs. Não recarrega código: após editar um job, `docker compose restart sidekiq`.
  sidekiq:
    <<: *rails
    command: bundle exec sidekiq -C config/sidekiq.yml
    ports: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Túnel HTTPS público para receber webhooks (PayPal, Twilio) no servidor de dev. Só com o perfil:
  #   docker compose --profile tunnel up tunnel   → a URL https://*.trycloudflare.com aparece no log
  # Depois cadastre a URL no provedor (webhook) e ponha o id em .env (PAYPAL_WEBHOOK_ID).
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:3000
    profiles: [tunnel]
    depends_on:
      web:
        condition: service_started

  # Recompila o Tailwind ao salvar arquivos
  css:
    <<: *rails
    command: bin/rails tailwindcss:watch
    ports: []
    depends_on: []

volumes:
  pgdata:
  redisdata:
  miniodata:
  bundle:
