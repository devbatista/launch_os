name: 21-Day Procrastination Reset
headline: "Stop putting things off. One small start at a time."
subheadline: "A practical 21-day workbook: one short challenge a day, a 5-minute method for starting, and a toolkit you keep using after Day 21. 10–20 minutes a day."
